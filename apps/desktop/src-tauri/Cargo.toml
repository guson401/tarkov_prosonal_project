[package]
name = "tarkov-companion"
version = "0.1.0"
description = "Local Escape from Tarkov companion"
authors = []
edition = "2021"

[lib]
name = "tarkov_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
serde_json = "1"
